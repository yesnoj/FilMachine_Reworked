<svg viewBox="0 0 900 690" xmlns="http://www.w3.org/2000/svg" role="img" style="font-family: system-ui, -apple-system, sans-serif; background: #ffffff;">
  <title>FilMachine — System Architecture and Wiring Diagram</title>
  <desc>Complete hardware architecture showing ESP32-P4 connections to display, touch, sensors, actuators, and companion chips</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#888"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#10b981"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f59e0b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-cyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#06b6d4"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .title { font-size: 18px; font-weight: 800; fill: #1a1a1a; letter-spacing: -0.5px; }
    .subtitle { font-size: 11px; fill: #888; }
    .chip-label { font-size: 13px; font-weight: 700; fill: white; }
    .chip-sub { font-size: 9px; fill: rgba(255,255,255,0.85); }
    .comp-label { font-size: 11px; font-weight: 600; fill: #222; }
    .comp-detail { font-size: 9px; fill: #666; }
    .bus-label { font-size: 8px; font-weight: 600; letter-spacing: 0.5px; }
    .pin-tag { font-size: 7.5px; fill: #999; }
    .legend-text { font-size: 9px; fill: #666; }
  </style>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" class="title">FilMachine — Hardware Architecture</text>
  <text x="450" y="44" text-anchor="middle" class="subtitle">Guition JC4880P433 · ESP32-P4 RISC-V · ESP-IDF 5.5</text>

  <!-- ═══ CPU ═══ -->
  <rect x="310" y="160" width="280" height="110" rx="12" fill="#1e293b" filter="url(#glow)"/>
  <rect x="310" y="160" width="280" height="110" rx="12" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <g opacity="0.3">
    <rect x="330" y="154" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="348" y="154" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="366" y="154" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="384" y="154" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="510" y="154" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="528" y="154" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="546" y="154" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="564" y="154" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="330" y="270" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="348" y="270" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="366" y="270" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="384" y="270" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="510" y="270" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="528" y="270" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="546" y="270" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="564" y="270" width="8" height="6" rx="1" fill="#94a3b8"/>
    <rect x="304" y="180" width="6" height="8" rx="1" fill="#94a3b8"/>
    <rect x="304" y="198" width="6" height="8" rx="1" fill="#94a3b8"/>
    <rect x="304" y="216" width="6" height="8" rx="1" fill="#94a3b8"/>
    <rect x="304" y="234" width="6" height="8" rx="1" fill="#94a3b8"/>
    <rect x="590" y="180" width="6" height="8" rx="1" fill="#94a3b8"/>
    <rect x="590" y="198" width="6" height="8" rx="1" fill="#94a3b8"/>
    <rect x="590" y="216" width="6" height="8" rx="1" fill="#94a3b8"/>
    <rect x="590" y="234" width="6" height="8" rx="1" fill="#94a3b8"/>
  </g>
  <text x="450" y="198" text-anchor="middle" class="chip-label" font-size="15">ESP32-P4</text>
  <text x="450" y="214" text-anchor="middle" class="chip-sub">RISC-V Dual-Core @ 400 MHz</text>
  <text x="450" y="228" text-anchor="middle" class="chip-sub">32 MB PSRAM · 16 MB Flash</text>
  <text x="450" y="242" text-anchor="middle" class="chip-sub">PPA 2D Engine · MIPI-DSI</text>
  <rect x="420" y="250" width="60" height="14" rx="3" fill="#3b82f6" opacity="0.3"/>
  <text x="450" y="260" text-anchor="middle" font-size="8" font-weight="700" fill="#93c5fd">FilMachine</text>

  <!-- ═══ DISPLAY ═══ -->
  <rect x="30" y="60" width="200" height="80" rx="8" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="42" y="72" width="70" height="42" rx="4" fill="#1e293b"/>
  <rect x="46" y="76" width="62" height="34" rx="2" fill="#3b82f6" opacity="0.3"/>
  <text x="77" y="97" text-anchor="middle" font-size="7" fill="#93c5fd" font-weight="600">800x480</text>
  <text x="160" y="90" text-anchor="middle" class="comp-label">ST7701S Display</text>
  <text x="160" y="103" text-anchor="middle" class="comp-detail">4.3" IPS · MIPI-DSI · PPA 90°</text>
  <text x="160" y="128" text-anchor="middle" class="pin-tag">GPIO 23 (BLK) · GPIO 5 (RST)</text>
  <path d="M 230 105 Q 270 105 310 180" stroke="#3b82f6" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arr-blue)"/>
  <text x="258" y="132" class="bus-label" fill="#3b82f6" transform="rotate(-30, 258, 132)">MIPI-DSI 2-lane</text>

  <!-- ═══ TOUCH ═══ -->
  <rect x="30" y="155" width="200" height="58" rx="8" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="55" y="190" text-anchor="middle" font-size="14">👆</text>
  <text x="145" y="180" text-anchor="middle" class="comp-label">GT911 Touch</text>
  <text x="145" y="193" text-anchor="middle" class="comp-detail">Capacitive · remap 480x800 → 800x480</text>
  <text x="145" y="206" text-anchor="middle" class="pin-tag">GPIO 7 (SDA) · GPIO 8 (SCL)</text>
  <line x1="230" y1="186" x2="306" y2="205" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="260" y="186" class="bus-label" fill="#8b5cf6">I2C</text>

  <!-- ═══ MCP23017 ═══ -->
  <rect x="30" y="230" width="210" height="100" rx="8" fill="#ec4899" opacity="0.1" stroke="#ec4899" stroke-width="1.2"/>
  <text x="55" y="265" text-anchor="middle" font-size="14">🔌</text>
  <text x="150" y="255" text-anchor="middle" class="comp-label">MCP23017 Solenoid Driver</text>
  <text x="150" y="268" text-anchor="middle" class="comp-detail">I2C addr 0x20 · 6 channels</text>
  <text x="60" y="288" class="comp-detail" font-size="8">Ch0: Heater    Ch3: Chem 3</text>
  <text x="60" y="299" class="comp-detail" font-size="8">Ch1: Chem 1    Ch4: Wash Bath</text>
  <text x="60" y="310" class="comp-detail" font-size="8">Ch2: Chem 2    Ch5: Waste</text>
  <text x="135" y="324" text-anchor="middle" class="pin-tag">Shared I2C bus (GPIO 7/8)</text>
  <line x1="240" y1="275" x2="306" y2="240" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr)"/>
  <text x="270" y="250" class="bus-label" fill="#ec4899">I2C</text>

  <!-- ═══ SD CARD ═══ -->
  <rect x="670" y="60" width="200" height="72" rx="8" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
  <text x="700" y="97" text-anchor="middle" font-size="14">💾</text>
  <text x="800" y="90" text-anchor="middle" class="comp-label">MicroSD Card</text>
  <text x="800" y="103" text-anchor="middle" class="comp-detail">SDMMC 4-bit · ~40 MB/s</text>
  <text x="800" y="122" text-anchor="middle" class="pin-tag">GPIO 39-44</text>
  <path d="M 670 100 Q 630 100 590 180" stroke="#10b981" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="640" y="128" class="bus-label" fill="#10b981" transform="rotate(30, 640, 128)">SDMMC 4-bit</text>

  <!-- ═══ AUDIO ═══ -->
  <rect x="670" y="150" width="200" height="72" rx="8" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="700" y="190" text-anchor="middle" font-size="14">🔊</text>
  <text x="800" y="180" text-anchor="middle" class="comp-label">ES8311 Audio Codec</text>
  <text x="800" y="193" text-anchor="middle" class="comp-detail">I2S + Power Amplifier</text>
  <text x="800" y="212" text-anchor="middle" class="pin-tag">GPIO 9,10,11,12,13,48</text>
  <line x1="670" y1="190" x2="594" y2="210" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="640" y="192" class="bus-label" fill="#f59e0b">I2S</text>

  <!-- ═══ ESP32-C6 WI-FI ═══ -->
  <rect x="670" y="240" width="200" height="85" rx="8" fill="#06b6d4" opacity="0.1" stroke="#06b6d4" stroke-width="1.2"/>
  <rect x="682" y="252" width="36" height="30" rx="4" fill="#0e7490"/>
  <text x="700" y="271" text-anchor="middle" font-size="7" fill="white" font-weight="700">C6</text>
  <text x="800" y="265" text-anchor="middle" class="comp-label">ESP32-C6 Companion</text>
  <text x="800" y="278" text-anchor="middle" class="comp-detail">Wi-Fi 6 + BLE 5.0</text>
  <text x="800" y="291" text-anchor="middle" class="comp-detail">WebSocket → Flutter App</text>
  <text x="770" y="315" text-anchor="middle" class="pin-tag">GPIO 14-19, 54 (reset)</text>
  <line x1="670" y1="275" x2="594" y2="240" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <text x="636" y="250" class="bus-label" fill="#06b6d4">SDIO</text>

  <!-- ═══ JP1 HEADER ═══ -->
  <rect x="360" y="300" width="180" height="26" rx="5" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="450" y="317" text-anchor="middle" font-size="9" font-weight="700" fill="#94a3b8">JP1 EXPAND IO — 2x13 PIN</text>
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="380" cy="308" r="2"/><circle cx="392" cy="308" r="2"/><circle cx="404" cy="308" r="2"/>
    <circle cx="416" cy="308" r="2"/><circle cx="428" cy="308" r="2"/><circle cx="440" cy="308" r="2"/>
    <circle cx="452" cy="308" r="2"/><circle cx="464" cy="308" r="2"/><circle cx="476" cy="308" r="2"/>
    <circle cx="488" cy="308" r="2"/><circle cx="500" cy="308" r="2"/><circle cx="512" cy="308" r="2"/>
    <circle cx="524" cy="308" r="2"/>
  </g>
  <line x1="450" y1="270" x2="450" y2="300" stroke="#475569" stroke-width="2"/>

  <!-- ═══ DBH-12V MOTOR DRIVER ═══ -->
  <rect x="295" y="360" width="310" height="100" rx="8" fill="#7c3aed" opacity="0.08" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="450" y="378" text-anchor="middle" class="comp-label" font-size="12">DBH-12V Dual H-Bridge Motor Driver</text>
  <text x="450" y="392" text-anchor="middle" class="comp-detail">12V external power · 2 independent channels</text>
  <rect x="310" y="402" width="130" height="48" rx="6" fill="#7c3aed" opacity="0.12" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="375" y="418" text-anchor="middle" class="comp-label" font-size="10" fill="#7c3aed">Ch.A — Agitation Motor</text>
  <text x="375" y="432" text-anchor="middle" class="comp-detail">Film reel rotation</text>
  <text x="375" y="444" text-anchor="middle" class="pin-tag">GPIO 32(PWM) 33(IN1) 34(IN2)</text>
  <rect x="460" y="402" width="130" height="48" rx="6" fill="#e11d48" opacity="0.12" stroke="#e11d48" stroke-width="0.8"/>
  <text x="525" y="418" text-anchor="middle" class="comp-label" font-size="10" fill="#e11d48">Ch.B — Pump</text>
  <text x="525" y="432" text-anchor="middle" class="comp-detail">Fill/drain (reversible)</text>
  <text x="525" y="444" text-anchor="middle" class="pin-tag">GPIO 51(PWM) 49(IN1) 50(IN2)</text>
  <line x1="420" y1="326" x2="375" y2="360" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <line x1="480" y1="326" x2="525" y2="360" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ═══ TEMPERATURE ═══ -->
  <rect x="30" y="360" width="210" height="80" rx="8" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="55" y="400" text-anchor="middle" font-size="14">🌡️</text>
  <text x="155" y="390" text-anchor="middle" class="comp-label">DS18B20 x 2</text>
  <text x="155" y="403" text-anchor="middle" class="comp-detail">OneWire shared bus + 4.7k pull-up</text>
  <text x="85" y="422" class="comp-detail" font-size="8">Sensor 0: Bath temperature</text>
  <text x="85" y="433" class="comp-detail" font-size="8">Sensor 1: Chemical temperature</text>
  <path d="M 240 395 Q 290 370 360 335" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arr-orange)"/>
  <text x="290" y="357" class="bus-label" fill="#f59e0b">OneWire · GPIO 35</text>

  <!-- ═══ SENSORS ROW ═══ -->
  <rect x="30" y="475" width="170" height="65" rx="8" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
  <text x="55" y="510" text-anchor="middle" font-size="12">💧</text>
  <text x="132" y="502" text-anchor="middle" class="comp-label">Flow Meter</text>
  <text x="132" y="515" text-anchor="middle" class="comp-detail">YF-S201 · pulse count</text>
  <text x="115" y="532" text-anchor="middle" class="pin-tag">GPIO 52 · JP1 pin 7</text>
  <path d="M 115 475 Q 160 430 370 330" stroke="#ef4444" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <rect x="220" y="475" width="195" height="65" rx="8" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
  <text x="247" y="510" text-anchor="middle" font-size="12">🫧</text>
  <text x="340" y="499" text-anchor="middle" class="comp-label">Water Level x 2</text>
  <text x="340" y="512" text-anchor="middle" class="comp-detail">XKC-Y21 contactless</text>
  <text x="318" y="528" text-anchor="middle" class="pin-tag">MIN: GPIO 29 · MAX: GPIO 30</text>
  <path d="M 317 475 Q 370 440 430 330" stroke="#ef4444" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <rect x="435" y="475" width="170" height="65" rx="8" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
  <text x="462" y="510" text-anchor="middle" font-size="12">🧲</text>
  <text x="543" y="502" text-anchor="middle" class="comp-label">Hall Sensor</text>
  <text x="543" y="515" text-anchor="middle" class="comp-detail">KY-003 · motor position</text>
  <text x="520" y="532" text-anchor="middle" class="pin-tag">GPIO 31 · JP1 pin 10</text>
  <path d="M 520 475 Q 490 440 470 330" stroke="#ef4444" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <!-- ═══ FLUTTER APP ═══ -->
  <rect x="670" y="370" width="200" height="80" rx="8" fill="#06b6d4" opacity="0.1" stroke="#06b6d4" stroke-width="1.2"/>
  <rect x="690" y="382" width="28" height="48" rx="5" fill="#0e7490" opacity="0.3" stroke="#06b6d4" stroke-width="0.8"/>
  <rect x="694" y="388" width="20" height="32" rx="2" fill="#06b6d4" opacity="0.2"/>
  <text x="800" y="400" text-anchor="middle" class="comp-label">Flutter Companion App</text>
  <text x="800" y="413" text-anchor="middle" class="comp-detail">Remote control via WebSocket</text>
  <text x="800" y="426" text-anchor="middle" class="comp-detail">Any device on same Wi-Fi</text>
  <text x="800" y="439" text-anchor="middle" class="comp-detail" font-size="8">Real-time process monitoring</text>
  <path d="M 750 325 Q 740 350 700 370" stroke="#06b6d4" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
  <text x="720" y="352" class="bus-label" fill="#06b6d4">WebSocket</text>
  <path d="M 730 340 Q 735 334 740 340" stroke="#06b6d4" stroke-width="0.8" fill="none"/>
  <path d="M 725 345 Q 735 333 745 345" stroke="#06b6d4" stroke-width="0.8" fill="none"/>

  <!-- ═══ POWER ═══ -->
  <rect x="670" y="475" width="200" height="65" rx="8" fill="#64748b" opacity="0.1" stroke="#64748b" stroke-width="1.2"/>
  <text x="770" y="495" text-anchor="middle" class="comp-label">Power Distribution</text>
  <rect x="685" y="505" width="45" height="18" rx="4" fill="#fbbf24" opacity="0.3" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="707" y="517" text-anchor="middle" class="comp-detail" font-size="8" font-weight="600">3.3V</text>
  <rect x="740" y="505" width="35" height="18" rx="4" fill="#f87171" opacity="0.3" stroke="#f87171" stroke-width="0.8"/>
  <text x="757" y="517" text-anchor="middle" class="comp-detail" font-size="8" font-weight="600">5V</text>
  <rect x="785" y="505" width="70" height="18" rx="4" fill="#ef4444" opacity="0.3" stroke="#ef4444" stroke-width="0.8"/>
  <text x="820" y="517" text-anchor="middle" class="comp-detail" font-size="8" font-weight="600">12V EXT</text>
  <text x="770" y="535" text-anchor="middle" class="pin-tag">3.3V/5V from JP1 · 12V for DBH-12V</text>

  <!-- ═══ LEGEND ═══ -->
  <rect x="30" y="565" width="840" height="42" rx="6" fill="#f8f8f8" stroke="#e2e2e2" stroke-width="1"/>
  <text x="55" y="584" class="legend-text" font-weight="600">Bus protocols:</text>
  <line x1="130" y1="581" x2="155" y2="581" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="160" y="584" class="legend-text">MIPI-DSI</text>
  <line x1="205" y1="581" x2="230" y2="581" stroke="#8b5cf6" stroke-width="2"/>
  <text x="235" y="584" class="legend-text">I2C</text>
  <line x1="255" y1="581" x2="280" y2="581" stroke="#f59e0b" stroke-width="2"/>
  <text x="285" y="584" class="legend-text">I2S</text>
  <line x1="305" y1="581" x2="330" y2="581" stroke="#06b6d4" stroke-width="2"/>
  <text x="335" y="584" class="legend-text">SDIO</text>
  <line x1="360" y1="581" x2="385" y2="581" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="390" y="584" class="legend-text">SDMMC</text>
  <line x1="430" y1="581" x2="455" y2="581" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="460" y="584" class="legend-text">OneWire</text>
  <line x1="500" y1="581" x2="525" y2="581" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="530" y="584" class="legend-text">Digital GPIO</text>
  <line x1="585" y1="581" x2="610" y2="581" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="615" y="584" class="legend-text">PWM + Direction</text>
  <text x="55" y="600" class="legend-text" fill="#aaa">35 GPIO pins assigned · 13 free (internal, not on JP1) · All 12 JP1 GPIO pins allocated</text>

</svg>
