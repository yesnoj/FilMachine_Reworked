dependencies:
  lvgl/lvgl: "~9.5.0"

  # ── Touch driver ──
  espressif/esp_lcd_touch_gt911: "*"      # GT911 capacitive

  # ── Audio (ES8311 codec over I2S + power amplifier) ──
  # Pinned to the version the board vendor's demo uses (avoids surprise majors).
  espressif/esp_codec_dev: "1.2.*"

  # ── Networking ──
  espressif/mdns: "*"

  # ── Wi-Fi via ESP32-C6 companion chip (ESP-Hosted SDIO) ──
  # Required for ESP32-P4 which has no native Wi-Fi.
  # The esp_hosted component provides the SDIO transport layer,
  # and esp_wifi_remote wraps the standard esp_wifi API over it.
  # PINNED: newer releases (esp_hosted 2.12.9 / esp_wifi_remote 1.6.1) bootloop
  # with an xTaskCreateStaticPinnedToCore stack assert during add_esp_wifi_remote_channels.
  # These are the last known-good versions — do NOT loosen to "*" without re-testing on the board.
  espressif/esp_hosted: "==2.12.3"
  espressif/esp_wifi_remote: "==1.5.0"
